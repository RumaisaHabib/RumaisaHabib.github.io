<!doctype html>
<html>
   <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="color-scheme" content="light dark">
      <title>Publications</title>
      <link rel="canonical" href="https://rumaisahabib.com/publications">
      <script>
         (function () {
            try {
               var theme = localStorage.getItem("theme");
               if (theme === "light" || theme === "dark") document.documentElement.style.colorScheme = theme;
            } catch (e) {}
            var key = "redirected:/publications";
            var last = 0;
            try { last = Number(sessionStorage.getItem(key)) || 0; } catch (e) {}
            if (Date.now() - last < 2000) {
               document.addEventListener("DOMContentLoaded", function () {
                  document.getElementById("moved").hidden = false;
               });
               return;
            }
            try { sessionStorage.setItem(key, String(Date.now())); } catch (e) {}
            location.replace("/publications" + location.search + location.hash);
         })();
      </script>
      <noscript><meta http-equiv="refresh" content="0; url=/publications"></noscript>
   </head>
   <body>
      <p id="moved" hidden>This page has moved to <a href="/publications">rumaisahabib.com/publications</a>.</p>
      <noscript><p>This page has moved to <a href="/publications">rumaisahabib.com/publications</a>.</p></noscript>
   </body>
</html>
